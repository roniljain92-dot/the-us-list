function updateStats(){const v=restaurants.filter(r=>getState(r.id).visited).length,f=restaurants.filter(r=>getState(r.id).fav).length;visitedCount.textContent=v;leftCount.textContent=restaurants.length-v;favCount.textContent=f;bar.style.width=(restaurants.length?v/restaurants.length*100:0)+'%'}
function matches(r){const s=getState(r.id),q=search.value.trim().toLowerCase();if(currentCategory!=='all'&&r.category!==currentCategory)return false;if(q&&!(r.name+' '+r.location+' '+r.category).toLowerCase().includes(q))return false;if(currentFilter==='pending'&&s.visited)return false;if(currentFilter==='visited'&&!s.visited)return false;if(currentFilter==='favourites'&&!s.fav)return false;if(currentFilter==='memories'&&!s.note)return false;return true}
function renderBucketTiles(){const wrap=document.getElementById('bucketTiles');const defs=[['all','✨','All'],...categories.map(c=>[c,icons[c]||'✨',c])];wrap.innerHTML=defs.map(([key,icon,label])=>{const n=key==='all'?restaurants.length:restaurants.filter(r=>r.category===key).length;return `<button class="bucket-tile ${currentCategory===key?'active':''}" data-category="${escapeHtml(key)}"><span class="bucket-icon">${icon}</span>${escapeHtml(label)}<span class="bucket-num">${n} places</span></button>`}).join('');wrap.querySelectorAll('.bucket-tile').forEach(b=>b.onclick=()=>{currentCategory=b.dataset.category;render()})}
function render(){renderBucketTiles();list.innerHTML='';let shown=0;categories.concat(['Other']).forEach((cat,idx)=>{const arr=restaurants.filter(r=>(categories.includes(r.category)?r.category:'Other')===cat&&matches(r));if(!arr.length)return;shown+=arr.length;const sec=document.createElement('details');sec.className='category';sec.open=idx<2||search.value.trim()!==''||currentFilter!=='all';sec.innerHTML=`<summary class="category-head"><div class="category-title"><span class="icon">${icons[cat]||'✨'}</span>${cat}</div><div class="category-count">${arr.length} place${arr.length!==1?'s':''}</div></summary><div class="category-body"></div>`;const body=sec.querySelector('.category-body');arr.forEach(r=>body.appendChild(card(r)));list.appendChild(sec)});if(!shown)list.innerHTML='<div class="empty">No restaurants match this view.<br>Try another filter or search.</div>';updateStats()}
function card(r){const s=getState(r.id),el=document.createElement('article');el.className='restaurant'+(s.visited?' visited':'');el.innerHTML=`<div class="topline"><input class="check" type="checkbox" ${s.visited?'checked':''} aria-label="Mark visited"><div class="namewrap"><div class="name">${escapeHtml(r.name)}</div><div class="loc">📍 ${escapeHtml(r.location||'Area not added')}</div></div><button class="heart ${s.fav?'on':''}" aria-label="Favourite">${s.fav?'♥':'♡'}</button></div><div class="meta"><a class="pill" href="${safeUrl(r.zomato)}" target="_blank" rel="noopener">🍽️ Zomato</a><button class="pill ${s.note?'note-on':''}">${s.note?'📝 Memory saved':'＋ Add memory'}</button>${s.rating?`<span class="pill">${'★'.repeat(Number(s.rating))}</span>`:''}</div>`;
const check=el.querySelector('.check'),heart=el.querySelector('.heart'),noteBtn=el.querySelector('button.pill');check.onchange=()=>{state[r.id]={...getState(r.id),visited:check.checked};queueCloudSave();render();if(check.checked&&navigator.vibrate)navigator.vibrate(40)};heart.onclick=()=>{state[r.id]={...getState(r.id),fav:!getState(r.id).fav};queueCloudSave();render()};noteBtn.onclick=()=>openDetail(r.id);return el}
function escapeHtml(s=''){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function safeUrl(u){return /^https?:\/\//i.test(u||'')?u:'#'}
function openDetail(id){activeId=id;const r=restaurants.find(x=>x.id===id),s=getState(id);detailTitle.textContent=r.name;detailSub.textContent='📍 '+(r.location||'Area not added');visitDate.value=s.date||'';rating.value=s.rating||'';note.value=s.note||'';detailModal.classList.add('open')}
closeDetail.onclick=()=>detailModal.classList.remove('open');saveDetail.onclick=()=>{state[activeId]={...getState(activeId),date:visitDate.value,rating:rating.value,note:note.value.trim(),visited:getState(activeId).visited||!!visitDate.value};queueCloudSave();detailModal.classList.remove('open');render()};
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentFilter=b.dataset.filter;render()});search.oninput=render;
function pick(){const pool=restaurants.filter(r=>!getState(r.id).visited);const choices=pool.length?pool:restaurants;const r=choices[Math.floor(Math.random()*choices.length)];surpriseName.textContent=r.name;surpriseLoc.textContent='📍 '+r.location;surpriseModal.classList.add('open')}
surpriseBtn.onclick=pick;reroll.onclick=pick;closeSurprise.onclick=()=>surpriseModal.classList.remove('open');
newCategory.innerHTML=categories.map(c=>`<option>${c}</option>`).join('');addBtn.onclick=()=>addModal.classList.add('open');closeAdd.onclick=()=>addModal.classList.remove('open');saveAdd.onclick=()=>{const name=newName.value.trim();if(!name)return newName.focus();const r={name,location:newLocation.value.trim(),category:newCategory.value,zomato:newLink.value.trim(),id:'custom-'+Date.now()};custom.push(r);restaurants.push(r);newName.value=newLocation.value=newLink.value='';addModal.classList.remove('open');queueCloudSave();render()};
[detailModal,addModal,surpriseModal].forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open')}));
let db;
async function initFirebase(){try{firebase.initializeApp(firebaseConfig);db=firebase.firestore();await firebase.auth().signInAnonymously();remoteReady=true;setSync('Connected');db.collection('lists').doc(SHARED_DOC).onSnapshot(async snap=>{if(snap.exists){const d=snap.data();state=d.state||state;custom=d.custom||custom;restaurants=[...seed,...custom].map((r,i)=>({...r,id:r.id||slug(r.name)+'-'+i}));persistLocal();render()}else{await db.collection('lists').doc(SHARED_DOC).set({state,custom,createdAt:firebase.firestore.FieldValue.serverTimestamp()})}setSync('Synced',true)},e=>{console.error(e);setSync('Offline — saved locally')})}catch(e){console.error(e);setSync('Could not connect');syncStatus.onclick=()=>alert('Firebase connection error:\n\n'+(e.code||'')+': '+e.message)}}
render();initFirebase();
</script>
</body></html>
